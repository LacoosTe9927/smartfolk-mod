name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: gradle:8.8-jdk17
    steps:
      - uses: actions/checkout@v4
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: smartfolk-mod
          path: build/libs/*.jar
Update Gradle to 8.8
